# sql_exporter para la réplica de lectura.
# La conexión (DSN) llega por la variable SQLEXPORTER_TARGET_DSN (ver docker-compose.yml).
global:
  scrape_timeout: 25s
  scrape_timeout_offset: 500ms
  max_connections: 2
  max_idle_connections: 1

target:
  data_source_name: "mysql://definido-por-variable-de-entorno"
  collectors: [processlist]

collector_files:
  - "/config/collectors/*.collector.yml"
